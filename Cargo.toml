[package]
name = "abr-datafeel-dot"
version = "0.1.0"
edition = "2021"
description = "Relational multimodal control for the DataFeel Dot — Kernel V8 applied to thermal, haptic, and optical outputs as a single declared relational process."
authors = ["Robin Macomber <robinmacomber@gmail.com>"]

[[bin]]
name = "datafeel_demo"
path = "bin/datafeel_demo.rs"

[lib]
name = "abr_datafeel_dot"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# irrs-kernel: Kernel V8 — pinned to authorized commit 27b31ce.
# Authorized pin established during Verifier Review — do not change without separate authorization.
irrs-kernel = { git = "https://github.com/Relational-Relativity-Corporation/abr-irrs", rev = "27b31ce" }

[dev-dependencies]
# No external test deps required for Phase 1–4 conformance tests.
